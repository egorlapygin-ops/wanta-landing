<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Лаборатория Wanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/bundle.css">
<style>
/* Layout: sticky 240px route-nav + one column. Index = counters, principles, essays, a dense grid of experiment "specimens". Detail = lab note or essay. */
:root{--paper:#ffffff;--surface:#f0f2f9;--line:#e1e4ee;--ink:#0a0c10;--ink-muted:#5b6070;--ink-faint:#8a90a0;--dusk:#3a2bd8;--on-dusk:#ffffff;--dusk-tint:#ecebfd;--dusk-print:#3a2bd8;--dusk-shadow:#17126b;--dusk-glow:#a39dff;--print-white:#ffffff;--coral:#f1654c;--blush:#fabfd9;--pill-glass:rgba(255,255,255,0.5);--pill-divider:rgba(0,0,0,0.16);--focus:var(--dusk);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--radius-s:6px;--radius-m:10px;--radius-l:14px;--radius-pill:999px;--nav-width:240px;--text-max:640px;--plate-max:880px;--glyph-size:128px;--shadow-avatar:0 2px 6px rgba(0,0,0,0.2);--font-display:"Unbounded", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;--font-body:"Golos Text", "Helvetica Neue", Arial, sans-serif;--font-logo:"SK Pupok Solid", "Unbounded", sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0a0c10;--surface:#14171e;--line:#252a35;--ink:#eceef5;--ink-muted:#9aa0b0;--ink-faint:#5d6372;--dusk:#8f87ff;--on-dusk:#0a0c10;--dusk-tint:#1c1a3d;--pill-glass:rgba(255,255,255,0.08);--pill-divider:rgba(255,255,255,0.2);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0a0c10;--surface:#14171e;--line:#252a35;--ink:#eceef5;--ink-muted:#9aa0b0;--ink-faint:#5d6372;--dusk:#8f87ff;--on-dusk:#0a0c10;--dusk-tint:#1c1a3d;--pill-glass:rgba(255,255,255,0.08);--pill-divider:rgba(255,255,255,0.2);color-scheme:dark}

@font-face { font-family: "SK Pupok Solid"; src: url("../assets/fonts/SKPupok-Solid.ttf") format("truetype"); font-display: swap; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
.shell { display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); }
main { min-width: 0; padding-block: var(--space-12) var(--space-16); padding-inline: clamp(16px, 5vw, 72px); }
.col { max-width: 1040px; }
.text { max-width: var(--text-max); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; }
h1 { font-size: 46px; line-height: 54px; letter-spacing: -.02em; }
h2 { font-size: 26px; line-height: 34px; letter-spacing: -.015em; }
p { margin: 0; font-size: 17px; line-height: 27px; color: var(--ink-muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
section.block { padding-top: var(--space-16); scroll-margin-top: 24px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: var(--space-6); }

/* Header with counters */
.head { display: flex; flex-direction: column; gap: var(--space-4); }
.counters { margin-top: var(--space-8); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.counter { padding: 18px 20px; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.counter b { font: 500 44px/48px var(--font-display); letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.counter span { font: 500 14px/20px var(--font-body); color: var(--ink-muted); }
.counter.accent { background: var(--dusk-print); }
.counter.accent b, .counter.accent span { color: var(--print-white); }

/* Principles */
.principles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.principle { padding: 18px 20px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; }
.principle b { font: 500 20px/26px var(--font-display); color: var(--dusk); letter-spacing: -.01em; }
.principle span { font: 400 15px/22px var(--font-body); color: var(--ink-muted); }

/* Essays */
.essays { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.essay-card { display: grid; grid-template-rows: auto 1fr; border-radius: 14px; overflow: hidden; background: var(--surface); text-decoration: none; color: inherit; }
.essay-card .wn-plate canvas { border-radius: 0; }
.essay-card .wn-plate figcaption { display: none; }
.essay-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; }
.essay-card h3 { font-size: 21px; line-height: 29px; letter-spacing: -.01em; transition: color .2s; }
.essay-card:hover h3 { color: var(--dusk); }
.essay-body p { font-size: 15px; line-height: 23px; }
.go { margin-top: auto; padding-top: 6px; display: inline-flex; align-items: center; gap: 8px; font: 600 14px/20px var(--font-body); color: var(--dusk); }
.go i { width: 28px; height: 28px; border-radius: var(--radius-pill); background: var(--paper); display: grid; place-items: center; font-style: normal; transition: transform .2s; }
a:hover .go i { transform: translateX(3px); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 34px; padding: 0 14px; border-radius: var(--radius-pill); border: 0; background: var(--surface); color: var(--ink-muted); font: 600 13px/18px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chip .st { margin: 0; }

/* Experiment grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; gap: 16px; margin-top: var(--space-6); }
.exp { display: flex; flex-direction: column; border-radius: 14px; background: var(--surface); text-decoration: none; color: inherit; overflow: hidden; min-width: 0; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.exp:hover { transform: translateY(-3px); }
.exp.wide { grid-column: span 2; }
.exp-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px 18px 0; font: 500 13px/18px var(--font-body); color: var(--ink-muted); }
.exp-no { font-variant-numeric: tabular-nums; }
.spec { margin: 12px 12px 0; border-radius: 10px; background: var(--paper); min-height: 172px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative; overflow: hidden; }
.spec-big { font: 500 38px/42px var(--font-display); letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.spec-cap { font: 500 13px/18px var(--font-body); color: var(--ink-muted); }
.spec ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.spec li { display: flex; gap: 8px; align-items: baseline; font: 500 14px/20px var(--font-body); color: var(--ink); }
.spec li::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--dusk); flex: none; transform: translateY(-2px); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; font: 500 13px/18px var(--font-body); color: var(--ink-muted); }
.bar-track { position: relative; height: 22px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 4px; border-radius: var(--radius-pill); background: var(--line); }
.bar.accent .bar-fill { background: var(--dusk); }
.bar-val { position: absolute; top: 2px; font: 600 12px/18px var(--font-body); color: var(--ink); white-space: nowrap; }
.dots { display: flex; gap: 8px; }
.dots i { width: 22px; height: 22px; border-radius: var(--radius-pill); background: var(--dusk); display: grid; place-items: center; }
.dots i::after { content: ""; width: 8px; height: 5px; border-left: 2px solid var(--on-dusk); border-bottom: 2px solid var(--on-dusk); transform: rotate(-45deg) translate(1px, -1px); }
.dots i.miss { background: var(--line); }
.dots i.miss::after { display: none; }
.split { height: 22px; border-radius: var(--radius-pill); overflow: hidden; display: flex; background: var(--line); }
.split i { background: var(--dusk); }
.spec.media { padding: 0; min-height: 0; background: transparent; }
.spec.media .wn-plate canvas { border-radius: 10px; aspect-ratio: 16 / 9; }
.spec.media .wn-plate figcaption { display: none; }
.spec-over { position: absolute; left: 14px; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 2px; }
.spec-over .spec-big { color: var(--print-white); }
.spec-over .spec-cap { color: var(--print-white); opacity: .85; }
.spec.glyphy { flex-direction: row; align-items: center; justify-content: flex-start; gap: 16px; }
.spec.glyphy .wn-glyph { width: 96px !important; height: 96px !important; border-radius: 9px; }
.exp-body { padding: 14px 18px 0; display: flex; flex-direction: column; gap: 6px; }
.exp h3 { font-size: 17px; line-height: 24px; letter-spacing: -.005em; transition: color .2s; }
.exp:hover h3 { color: var(--dusk); }
.exp-q { font: 400 14px/21px var(--font-body); color: var(--ink-muted); }
.exp-foot { margin-top: auto; padding: 14px 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); margin-inline: 0; }
.exp-foot b { font: 600 13px/18px var(--font-body); color: var(--dusk); display: inline-flex; gap: 6px; align-items: center; }
.exp-foot b i { font-style: normal; transition: transform .2s; }
.exp:hover .exp-foot b i { transform: translateX(3px); }
.exp-wrap { margin-top: 14px; }

/* Status pill */
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--paper); font: 600 12px/16px var(--font-body); color: var(--ink); white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: var(--radius-pill); box-sizing: border-box; }
.st.s-confirmed i { background: var(--dusk); }
.st.s-closed i { background: var(--ink); }
.st.s-queued i { border: 1.5px solid var(--ink-faint); }
.st.s-pending i { border: 1.5px solid var(--dusk); }
.st.s-running i { background: var(--dusk); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--dusk-tint); } }
@media (prefers-reduced-motion: reduce) { .st.s-running i { animation: none; } .exp, .go i, .exp-foot b i { transition: none; } }

/* Detail: lab note */
.back { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: var(--radius-pill); border: 0; background: var(--surface); font: 600 14px/20px var(--font-body); color: var(--ink); cursor: pointer; }
.back:hover { background: var(--dusk-tint); color: var(--dusk); }
.note-head { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-4); max-width: 820px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 14px/20px var(--font-body); color: var(--ink-muted); }
.note-q { font: 400 24px/34px var(--font-display); letter-spacing: -.01em; color: var(--ink); max-width: 760px; text-wrap: balance; }
.note-grid { margin-top: var(--space-8); display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.note-grid .spec { margin: 0; background: var(--surface); position: sticky; top: 24px; }
.note-grid .spec.media { background: transparent; }
.note-secs { display: flex; flex-direction: column; gap: var(--space-8); }
.note-sec { scroll-margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
.note-sec .lab-n { font: 600 13px/18px var(--font-body); color: var(--dusk); }
.note-sec h2 { font-size: 20px; line-height: 28px; }
.note-sec p { color: var(--ink); font-size: 18px; line-height: 29px; }
.grew { padding: 20px 22px; border-radius: 12px; background: var(--dusk-tint); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.grew p { color: var(--ink); }
.essay-link { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 18px; border-radius: var(--radius-pill); background: var(--dusk); color: var(--on-dusk); font: 600 14px/20px var(--font-body); text-decoration: none; border: 0; cursor: pointer; }
.essay-link i { width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--paper); color: var(--dusk); display: grid; place-items: center; font-style: normal; }
.more { margin-top: var(--space-16); }
.more .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* Detail: essay */
.essay-head { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-4); max-width: 820px; }
.essay-head .lead { font-size: 20px; line-height: 31px; }
.essay-plate { margin-top: var(--space-8); }
.prose { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-4); }
.prose h2 { font-size: 24px; line-height: 32px; margin-top: var(--space-8); scroll-margin-top: 24px; }
.prose p { font-size: 18px; line-height: 30px; color: var(--ink); }
.prose blockquote { margin: var(--space-4) 0; padding: var(--space-6); border-radius: var(--radius-l); background: var(--dusk-tint); font: 500 21px/31px var(--font-display); letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }

/* Agent view */
.agent { display: flex; flex-direction: column; gap: var(--space-4); max-width: 760px; }
.raw { margin: 0; padding: var(--space-6); border-radius: var(--radius-l); background: var(--surface); color: var(--ink); font: 400 14px/22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

footer { margin-top: var(--space-16); padding-top: var(--space-6); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); max-width: 1040px; }
footer nav { display: flex; flex-wrap: wrap; gap: 6px 20px; }
footer a { font: 500 14px/20px var(--font-body); color: var(--ink-muted); text-decoration: none; }
footer small { font: 500 13px/18px var(--font-body); color: var(--ink-faint); }

.topbar { display: none; }
.drawer { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.drawer-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; }
.menu-btn { height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: 0; background: var(--surface); color: var(--ink); font: 600 14px/20px var(--font-body); cursor: pointer; }
@media (max-width: 1240px) { .grid, .more .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .principles, .counters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; align-items: center; justify-content: space-between; gap: 12px; padding: 12px clamp(16px, 5vw, 72px); background: var(--paper); border-bottom: 1px solid var(--line); }
  .topbar-here { flex: 1; min-width: 0; text-align: center; font: 500 14px/20px var(--font-body); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-block: var(--space-8) var(--space-12); }
}
@media (max-width: 760px) {
  h1 { font-size: 30px; line-height: 38px; }
  .grid, .more .grid, .essays { grid-template-columns: minmax(0, 1fr); }
  .exp.wide { grid-column: auto; }
  .note-grid { grid-template-columns: minmax(0, 1fr); }
  .note-grid .spec { position: static; }
  .counter b { font-size: 34px; line-height: 40px; }
  .note-q { font-size: 20px; line-height: 29px; }
}
@media (max-width: 560px) { .topbar .wn-format, .topbar-here { display: none; } .principles, .counters { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
(function () {
  var W = window.Wanta, L = window.LAB, h = React.createElement, useState = React.useState, useEffect = React.useEffect;
  var EXP = L.experiments.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.n - a.n; });
  var ITEMS = [{ id: "home", label: "Главная", href: "../" }, { id: "product", label: "Продукт" }, { id: "lab", label: "Лаборатория", href: "./" }, { id: "memo", label: "Инвестмемо" }];
  var STATUS = { running: "Идёт", confirmed: "Подтвердилась", queued: "В очереди", pending: "Ждёт решения", closed: "Закрыто", rejected: "Не подтвердилась" };
  var MONTHS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var MONTHS_G = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  function short(s) { var p = s.split("-"); return MONTHS[+p[1] - 1] + " " + p[0]; }

  function essayOf(id) { return L.essays.filter(function (e) { return e.id === id; })[0]; }

  function minutes(n) { return n + " мин"; }

  function Status(p) { return h("span", { className: "st s-" + p.s }, h("i", { "aria-hidden": true }), STATUS[p.s]); }

  function Spec(p) {

      bottom = h("div", { className: "bars" }, s.bars.map(function (b) {
        var w = Math.max(1.5, b.value / max * 100);
        return h("div", { key: b.label, className: "bar" + (b.accent ? " accent" : "") }, h("span", null, b.label),
          h("div", { className: "bar-track" }, h("div", { className: "bar-fill", style: { width: w + "%" } }),
            h("span", { className: "bar-val", style: w > 60 ? { right: (100 - w) + "%", marginRight: 8, color: b.accent ? "var(--on-dusk)" : "var(--ink)" } : { left: "calc(" + w + "% + 8px)" } }, b.text)));
      }));
    }
    if (s.kind === "dots") bottom = h("div", { className: "dots", role: "img", "aria-label": s.ok + " из " + s.total + " успешно" }, Array.from({ length: s.total }, function (_, i) { return h("i", { key: i, className: i < s.ok ? "" : "miss" }); }));
    if (s.kind === "split") bottom = h("div", { className: "split", role: "img", "aria-label": s.part + " из " + s.total }, h("i", { style: { width: (s.part / s.total * 100) + "%" } }));

  function ExpCard(p) {

    return h("a", { className: "exp" + (e.wide && !p.compact ? " wide" : ""), href: "#" + e.id, onClick: function (ev) { ev.preventDefault(); p.onOpen(e.id); } },
      h("div", { className: "exp-top" }, h("span", null, h("span", { className: "exp-no" }, "№" + pad(e.n)), " · ", e.type, " · ", short(e.date)), h(Status, { s: e.status })),

  function parse() {

  function useSpy(ids) {
    var s = useState({ active: ids[0], collapsed: false }), st = s[0], set = s[1], key = ids.join("|");

    var c = useState(false), menu = c[0], setMenu = c[1];
