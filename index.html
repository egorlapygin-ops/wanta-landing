/* Layout: sticky 240px route-nav flush left + one content column (text 640, plates 880). Tokens = Wanta Web design system. */
:root{--paper:#ffffff;--surface:#f0f2f9;--line:#e1e4ee;--ink:#0a0c10;--ink-muted:#5b6070;--ink-faint:#8a90a0;--dusk:#3a2bd8;--on-dusk:#ffffff;--dusk-tint:#ecebfd;--dusk-print:#3a2bd8;--dusk-shadow:#17126b;--dusk-glow:#a39dff;--print-white:#ffffff;--coral:#f1654c;--blush:#fabfd9;--pill-glass:rgba(255,255,255,0.5);--pill-divider:rgba(0,0,0,0.16);--focus:var(--dusk);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--radius-s:6px;--radius-m:10px;--radius-l:14px;--radius-pill:999px;--nav-width:240px;--text-max:640px;--plate-max:880px;--glyph-size:128px;--shadow-avatar:0 2px 6px rgba(0,0,0,0.2);--font-display:"Unbounded", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;--font-body:"Golos Text", "Helvetica Neue", Arial, sans-serif;--font-logo:"SK Pupok Solid", "Unbounded", sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0a0c10;--surface:#14171e;--line:#252a35;--ink:#eceef5;--ink-muted:#9aa0b0;--ink-faint:#5d6372;--dusk:#8f87ff;--on-dusk:#0a0c10;--dusk-tint:#1c1a3d;--pill-glass:rgba(255,255,255,0.08);--pill-divider:rgba(255,255,255,0.2);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0a0c10;--surface:#14171e;--line:#252a35;--ink:#eceef5;--ink-muted:#9aa0b0;--ink-faint:#5d6372;--dusk:#8f87ff;--on-dusk:#0a0c10;--dusk-tint:#1c1a3d;--pill-glass:rgba(255,255,255,0.08);--pill-divider:rgba(255,255,255,0.2);color-scheme:dark}

@font-face { font-family: "SK Pupok Solid"; src: url("assets/fonts/SKPupok-Solid.ttf") format("truetype"); font-display: swap; }

.stack { display: flex; flex-direction: column; }

.actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-2); }
.hero-plate { margin-top: var(--space-6); width: 100%; }
.try-recipe { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: center; gap: 32px; margin-top: 24px; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--paper); }

@media (max-width: 850px) {

}
@media (max-width: 480px) {

}
.expanded { margin-top: var(--space-12); gap: var(--space-4); }
.say { font-family: var(--font-display); font-size: 22px; line-height: 32px; letter-spacing: -.01em; color: var(--ink); margin-top: var(--space-4); max-width: 620px; text-wrap: balance; }
.say em { font-style: normal; color: var(--dusk); }
.sec-head { display: flex; flex-direction: column; gap: var(--space-4); margin-bottom: var(--space-8); }

/* Sources */
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sources .wn-label { margin-right: 8px; }
.src { padding: 8px 16px; border-radius: var(--radius-pill); background: var(--surface); font: 500 15px/20px var(--font-body); color: var(--ink); }

/* Intent card: one save turned into a structured want */
.intent-wrap { margin-top: var(--space-12); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.intent { border-radius: var(--radius-l); background: var(--surface); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.intent-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.intent-kind { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--radius-pill); background: var(--paper); font: 600 13px/18px var(--font-body); color: var(--ink); }
.intent-kind i { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--coral); }
.intent dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 20px; }
.intent dt { font: 500 14px/22px var(--font-body); color: var(--ink-muted); }
.intent dd { margin: 0; font: 500 15px/22px var(--font-body); color: var(--ink); }
.who { display: inline-flex; padding: 4px; gap: 4px; border-radius: var(--radius-pill); background: var(--paper); }
.who button { height: 36px; padding: 0 16px; border-radius: var(--radius-pill); border: 0; background: transparent; color: var(--ink-muted); font: 600 14px/20px var(--font-body); cursor: pointer; }
.who button[aria-pressed="true"] { background: var(--dusk); color: var(--on-dusk); }
.who button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.outcome { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; background: var(--paper); }
.outcome-dot { width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--dusk-tint); display: grid; place-items: center; flex: none; color: var(--dusk); font: 600 14px/1 var(--font-body); }
.outcome strong { display: block; font: 600 15px/21px var(--font-body); color: var(--ink); }
.outcome span { font: 400 14px/20px var(--font-body); color: var(--ink-muted); }
.intent-note { display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-2); }

/* Figure 1: how a save flows through Wanta.
   Geometry: both core visuals are exactly 96px tall, so the inner wire sits at 47px; outer wires are centred on the board row. */
.fig { margin: var(--space-16) 0 0; }
.fig-board { border-radius: var(--radius-l); padding: 32px 28px; background-color: var(--surface); background-image: radial-gradient(circle, var(--line) 1.2px, transparent 1.4px); background-size: 20px 20px; display: grid; grid-template-columns: 104px minmax(40px, 1fr) 368px minmax(40px, 1fr) 176px; align-items: start; }
.fig-label { display: block; font: 600 13px/18px var(--font-body); color: var(--ink-muted); margin-bottom: 10px; }
.fig-col { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.fig-sources { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.fig-sources span { padding: 6px 12px; border-radius: var(--radius-pill); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font: 500 13px/18px var(--font-body); color: var(--ink); white-space: nowrap; }
.wire { position: relative; height: 2px; background: radial-gradient(circle, var(--ink-faint) 0 1px, transparent 1.2px) 0 0 / 6px 2px repeat-x; }
.wire::before, .wire::after { content: ""; position: absolute; top: -4px; width: 10px; height: 10px; box-sizing: border-box; border-radius: var(--radius-pill); border: 2px solid var(--dusk); background: var(--paper); }
.wire::before { left: -2px; } .wire::after { right: -2px; }
.wire i { position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--dusk); animation: travel 2.6s cubic-bezier(.5,0,.5,1) infinite; z-index: 1; }
.wire.inner i { background: var(--coral); animation-delay: .9s; }
.wire em { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; font: 500 12px/15px var(--font-body); font-style: normal; color: var(--ink-muted); }
@keyframes travel { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 8px); opacity: 0; } }
.fig-core { position: relative; border-radius: 13px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink-faint); padding: 36px 20px 20px; display: flex; flex-direction: column; gap: 20px; }
.fig-core-tag { position: absolute; top: -14px; left: 20px; display: inline-flex; align-items: center; gap: 10px; height: 28px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
.fig-core-tag span { font: 600 12px/16px var(--font-body); color: var(--ink-muted); white-space: nowrap; }
.fig-core-row { display: grid; grid-template-columns: 96px minmax(56px, 1fr) 176px; align-items: start; }
.fig-core-row > .wire { margin-top: 47px; }
/* outer wires sit on the same line as the core visuals: core padding-top 36 + half of 96 */
.fig-board > .wire { margin-top: 83px; }
.fig-board > .fig-col { padding-top: 14px; }
.fig-node { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fig-node .wn-glyph { width: 96px !important; height: 96px !important; border-radius: 11px; margin-bottom: 8px; }
.fig-node b { font: 600 14px/18px var(--font-body); color: var(--ink); }
.fig-node small { font: 500 12px/16px var(--font-body); color: var(--ink-muted); }
.fig-store { height: 96px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 6px; border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
.fig-store span { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 6px; background: var(--paper); font: 500 12px/16px var(--font-body); color: var(--ink); white-space: nowrap; }
.fig-store span i { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--dusk); flex: none; }
.fig-store span.place i { background: var(--coral); }
.fig-ctx { border-radius: 8px; border: 1.5px dashed var(--ink-faint); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.fig-ctx b { font: 600 12px/16px var(--font-body); color: var(--dusk); }
.fig-ctx span { font: 500 12px/16px var(--font-body); color: var(--ink-muted); }
.fig-actors { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.fig-actor { display: flex; flex-direction: row; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.fig-actor .ic { width: 34px; height: 34px; border-radius: 6px; background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.fig-actor.is-agent .ic { background: var(--dusk-print); color: var(--print-white); }
.fig-actor > div { flex: 1; min-width: 0; }
.fig-actor b { display: block; font: 600 14px/18px var(--font-body); color: var(--ink); }
.fig-actor small { display: block; font: 500 12px/16px var(--font-body); color: var(--ink-muted); }
.fig-or { text-align: center; font: 500 12px/16px var(--font-body); color: var(--ink-faint); }
/* Too narrow for one row: stack the board, wires turn vertical. */
@media (max-width: 1250px) and (min-width: 1101px), (max-width: 940px) {
  .fig-board { grid-template-columns: minmax(0, 1fr); justify-items: center; padding: 28px 20px; }
  .fig-board > .wire { width: 2px; height: 44px; margin: 10px 0 !important; background: radial-gradient(circle, var(--ink-faint) 0 1px, transparent 1.2px) 0 0 / 2px 6px repeat-y; }
  .fig-board > .wire::before { left: -4px; top: -2px; } .fig-board > .wire::after { left: -4px; right: auto; top: auto; bottom: -2px; }
  .fig-board > .wire i { left: -3px; animation-name: travelY; }
  .fig-col { align-items: center; padding-top: 0 !important; }
  .fig-sources { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .fig-core { width: 100%; max-width: 420px; box-sizing: border-box; }
  .fig-actors { max-width: 420px; }
}
@keyframes travelY { 0% { top: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: calc(100% - 8px); opacity: 0; } }
@media (max-width: 480px) {
  .fig-core-row { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .fig-core-row > .wire { display: none; }
  .fig-store { height: auto; }
}
@media (prefers-reduced-motion: reduce) { .wire i { animation: none; display: none; } }

/* In production */
.bots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.bot { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6); border-radius: var(--radius-l); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.bot .wn-glyph { width: 72px !important; height: 72px !important; border-radius: 8px; }
.bot p { font-size: 15px; line-height: 23px; }
.bot.is-live { box-shadow: inset 0 0 0 1px var(--dusk); }
.bot-link { margin-top: auto; padding-top: var(--space-4); color: var(--dusk); font: 600 15px/22px var(--font-body); text-underline-offset: 4px; }
.bot-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 2px; }
.status { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--surface); font: 600 13px/18px var(--font-body); color: var(--ink-muted); }
.status i { width: 7px; height: 7px; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-faint); box-sizing: border-box; }
.status.is-live { background: var(--dusk-tint); color: var(--dusk); }
.status.is-live i { background: var(--dusk); border-color: var(--dusk); }
.bot-cta { margin-top: var(--space-8); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }

/* Agent prompt + agent view */
.agent-prompt { width: 100%; margin-top: var(--space-2); }
.agent { display: flex; flex-direction: column; gap: var(--space-6); max-width: 760px; }
.agent-head { display: flex; flex-direction: column; gap: var(--space-3); }
.agent-links { display: flex; flex-wrap: wrap; gap: 8px; }
.agent-links a { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); background: var(--surface); font: 600 14px/20px var(--font-body); color: var(--ink); text-decoration: none; }
.agent-links a span { color: var(--ink-faint); }
.agent-links a:hover { background: var(--dusk-tint); color: var(--dusk); }
.raw { margin: 0; padding: var(--space-6); border-radius: var(--radius-l); background: var(--surface); color: var(--ink); font: 400 14px/22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.raw-wrap { min-width: 0; }

footer { margin-top: var(--space-16); padding-top: var(--space-6); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); }
footer nav { display: flex; flex-wrap: wrap; gap: 6px 20px; }
footer a { font: 500 14px/20px var(--font-body); color: var(--ink-muted); text-decoration: none; }
footer a:hover { color: var(--ink); }
footer small { font: 500 13px/18px var(--font-body); color: var(--ink-faint); }

/* Narrow: nav becomes a top bar with a progress line and a drawer */
.topbar { display: none; }
.drawer { position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border: 0; box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); background: var(--paper); color: var(--ink); overflow-y: auto; }
.drawer-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; }
.menu-btn { height: 40px; padding: 0 16px; border-radius: var(--radius-pill); border: 0; background: var(--surface); color: var(--ink); font: 600 14px/20px var(--font-body); cursor: pointer; }
.menu-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 1100px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; align-items: center; justify-content: space-between; gap: 12px; padding: 12px clamp(16px, 6vw, 88px); background: var(--paper); border-bottom: 1px solid var(--line); }
  .topbar-progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--dusk); transition: width .3s; }
  .topbar-here { flex: 1; min-width: 0; text-align: center; font: 500 14px/20px var(--font-body); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-block: var(--space-8) var(--space-12); }
  section { scroll-margin-top: 88px; }
  .bots { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) { .topbar .wn-format, .topbar-here { display: none; } }
@media (max-width: 860px) { .intent-wrap { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  h1 { font-size: 30px; line-height: 38px; }
  h2 { font-size: 24px; line-height: 32px; }
