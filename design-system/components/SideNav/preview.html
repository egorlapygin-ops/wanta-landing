<!-- @dsCard group="Навигация" height=600 subtitle="Наверху страницы и после первого экрана" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>SideNav</title>
<style>#root{display:flex;flex-wrap:wrap;gap:0}#root>div{border-right:1px solid var(--line);min-height:560px}.cap{padding:16px 32px 0}</style></head>
<body><div id="root"></div>
<script>
var W = window.Wanta, h = React.createElement;
var items = [
  { id: 'home', label: 'Главная' }, { id: 'product', label: 'Продукт' }, { id: 'blog', label: 'Блог' },
  { id: 'changes', label: 'Что нового' }, { id: 'business', label: 'Заведениям' },
  { id: 'help', label: 'Помощь', external: true }, { id: 'tg', label: 'Telegram-бот', external: true }
];
var toc = [
  { id: 'mission', label: 'Зачем Wanta' }, { id: 'what', label: 'Что мы делаем' },
  { id: 'how', label: 'Как это работает' }, { id: 'cities', label: 'Города' }, { id: 'team', label: 'Команда' }
];
function Demo() {
  var s = React.useState('what'), active = s[0], set = s[1];
  return h(React.Fragment, null,
    h('div', null, h('div', { className: 'cap wn-label' }, 'Первый экран'), h(W.SideNav, { items: items, active: 'home', toc: toc, activeToc: 'mission', format: 'human', onFormat: function () {} })),
    h('div', null, h('div', { className: 'cap wn-label' }, 'После скролла'), h(W.SideNav, { items: items, active: 'home', toc: toc, activeToc: active, collapsed: true, onTocClick: set, format: 'human', onFormat: function () {} })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
