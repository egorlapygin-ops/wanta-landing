        h(W.FeatureRow, { glyph: "near", title: "Возвращаем, когда пора решать" }, "Не в ленте, а в момент выбора: вечер пятницы рядом с баром, выходные с рецептом, распродажа нужной вещи."),
        h(W.FeatureRow, { glyph: "act", title: "Оставляем один шаг" }, "Маршрут, бронь, покупка или плеер. Этот шаг делаешь ты сам или поручаешь своему ИИ-агенту.")),
      h(Intent));
  }

  var BOTS = [
    { glyph: "act", title: "Товары", text: "Находит вещь из ролика и показывает, где её купить.", status: "Работает", live: true },
    { glyph: "near", title: "Места", text: "Находит заведение, адрес и часы работы, строит маршрут.", status: "В разработке" },
    { glyph: "save", title: "Рецепты", text: "Достаёт ингредиенты и шаги, собирает список покупок.", status: "В разработке" }
  ];
  function Production() {
    return h("section", { id: "production", className: "col" },
      h("div", { className: "sec-head" },
        h("span", { className: "wn-label" }, "Уже работает"),
        h("h2", null, "Telegram-бот"),
        h("p", { className: "text" }, "Перешли боту ролик, и он вернёт то, ради чего ты его сохранил. На боте мы проверяем вертикали по очереди, прежде чем переносить их в приложение.")),
      h("div", { className: "bots" }, BOTS.map(function (b) {
        return h("div", { key: b.title, className: "bot" },
          h(W.Glyph, { kind: b.glyph, size: 72, alt: "" }),
          h("h3", null, b.title), h("p", null, b.text),
          h("span", { className: "status" + (b.live ? " is-live" : "") }, h("i", { "aria-hidden": true }), b.status));
      })),
      h("div", { className: "bot-cta" }, h(W.Button, { variant: "primary", href: "#" }, "Открыть бота в Telegram")));
  }

  function Closing() {
    return h("div", { className: "band col" },
      h(W.Glyph, { kind: "save", size: 128, alt: "" }),
      h("div", { style: { minWidth: 0 } },
        h("h2", null, "Сохранил — значит сделаешь"),
        h("div", { className: "actions" },
          h(W.Button, { variant: "primary", href: "#" }, "Открыть бота"),
          h(W.Button, { variant: "secondary", href: "#", external: true }, "Исследования"))));
  }

  function Footer() {
    return h("footer", { className: "col" },
      h(W.Wordmark, { scale: 1.25, href: "#" }),
      h("nav", { "aria-label": "Ссылки в подвале" }, [["Продукт", "#"], ["Лаборатория", "lab/"], ["Инвестмемо", "#"], ["Конфиденциальность", "#"]].map(function (l) { return h("a", { key: l[0], href: l[1] }, l[0]); })),
      h("small", null, "© 2026 Wanta"));
  }

  function App() {
    var st = useScrollState(), m = useState(false), menu = m[0], setMenu = m[1];
    var f = useState(location.hash === "#agent" ? "agent" : "human"), format = f[0], setFormatState = f[1];
    function setFormat(v) {
      setFormatState(v); setMenu(false);
      try { history.replaceState(null, "", v === "agent" ? "#agent" : location.pathname + location.search); } catch (e) {}
      window.scrollTo(0, 0);
    }
    var agent = format === "agent";
    var here = TOC.filter(function (t) { return t.id === st.active; })[0];
    function nav(props) {
      return h(W.SideNav, Object.assign({ items: ITEMS, active: "home", toc: agent ? [] : TOC, activeToc: st.active, format: format, onFormat: setFormat, agentHref: "index.md", onTocClick: function (id) { setMenu(false); go(id); } }, props));
    }
    return h(React.Fragment, null,
      h("div", { className: "topbar" },
        h(W.Wordmark, { href: "#", scale: 1.25 }),
        h(W.FormatSwitch, { value: format, onChange: setFormat, agentHref: "index.md" }),
        h("span", { className: "topbar-here" }, agent ? "Markdown для агентов" : st.collapsed && here ? here.label : ""),
        h("button", { type: "button", className: "menu-btn", onClick: function () { setMenu(true); }, "aria-expanded": menu ? "true" : "false" }, "Меню"),
        h("span", { className: "topbar-progress", style: { width: (st.progress * 100) + "%" }, "aria-hidden": true })),
      menu ? h("div", { className: "drawer", role: "dialog", "aria-modal": "true", "aria-label": "Меню" },
        h("button", { type: "button", className: "menu-btn drawer-close", onClick: function () { setMenu(false); } }, "Закрыть"),
        nav({ collapsed: false })) : null,
      h("div", { className: "shell" },
        h("aside", { className: "side" }, nav({ collapsed: st.collapsed })),
        h("main", null, agent ? h(React.Fragment, null, h(AgentView), h(Footer)) : h(React.Fragment, null, h(Mission), h(What), h(Production), h(Closing), h(Footer)))));
  }
  ReactDOM.createRoot(document.getElementById("app")).render(h(App));
})();
</script>
